<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aim Map Walk Preview</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050607;
      color: #eef4f5;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #walk-preview {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
    }

    .crosshair::before,
    .crosshair::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: rgba(236, 252, 255, 0.88);
      box-shadow: 0 0 10px rgba(57, 231, 255, 0.7);
      transform: translate(-50%, -50%);
    }

    .crosshair::before {
      width: 18px;
      height: 2px;
    }

    .crosshair::after {
      width: 2px;
      height: 18px;
    }

    .status {
      position: absolute;
      left: 22px;
      bottom: 20px;
      min-width: 190px;
      padding: 10px 12px;
      border: 1px solid rgba(126, 234, 255, 0.24);
      background: rgba(4, 8, 10, 0.58);
      backdrop-filter: blur(14px);
      font-size: 12px;
      line-height: 1.45;
      letter-spacing: 0.04em;
    }

    .status strong {
      display: block;
      color: #74f4ff;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 42%, rgba(40, 236, 255, 0.16), transparent 34%),
        linear-gradient(180deg, rgba(3, 5, 7, 0.68), rgba(3, 5, 7, 0.92));
      transition: opacity 160ms ease;
    }

    .overlay.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .panel {
      width: min(420px, 92vw);
      padding: 22px;
      border: 1px solid rgba(133, 241, 255, 0.28);
      background: rgba(8, 13, 16, 0.76);
      box-shadow: 0 24px 90px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
    }

    .panel h1 {
      margin: 0 0 10px;
      color: #efffff;
      font-size: 22px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .panel p {
      margin: 0 0 18px;
      color: rgba(235, 250, 252, 0.68);
      font-size: 14px;
      line-height: 1.5;
    }

    .enter {
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 4px;
      background: linear-gradient(180deg, #8bfaff, #22a7f2);
      color: #031016;
      cursor: pointer;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .enter:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    .loading {
      position: fixed;
      top: 18px;
      left: 50%;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(0, 0, 0, 0.42);
      color: rgba(255, 255, 255, 0.76);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transform: translateX(-50%);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="walk-preview"></canvas>
  <div class="hud" aria-hidden="true">
    <div class="crosshair"></div>
    <div class="status">
      <strong>Aim Duel Box</strong>
      <span id="preview-status">Loading arena</span>
    </div>
  </div>
  <div id="loading" class="loading">Loading</div>
  <div id="overlay" class="overlay">
    <div class="panel">
      <h1>Aim Duel Box</h1>
      <p>Walk the upgraded 1v1 arena in first person.</p>
      <button id="enter" class="enter" type="button">Enter Map</button>
    </div>
  </div>
  <script type="module" src="/src/aimMapWalkPreview.js"></script>
</body>
</html>
